[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oaset/__init__.py"

[project]
name = "oaset-cli"
dynamic = ["version"]
description = "oAset CLI — an open-source terminal TUI coding agent. OpenAI-compatible providers, tool calling, session persistence, permission gating. Powered by Textual."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "oAset CLI contributors" }]
keywords = ["tui", "agent", "llm", "coding", "openai", "terminal", "cli",
            "mcp", "claude", "kimi", "chinese", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Terminals",
]
dependencies = [
  "textual>=8,<9",
  "openai>=2",
  "httpx>=0.27",
  "tomli-w>=1.0",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5",
       "mypy>=1.10", "build>=1.2", "pytest-timeout>=2.3"]
# build: the wheel-packaging gate needs it; pytest-timeout: names the test
# that hangs instead of letting a CI job burn to its 60-minute kill

[project.urls]
Homepage = "https://github.com/ydds2/oAset-CLI"

[project.scripts]
oaset = "oaset.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oaset"]
# skills/builtin ships as ordinary package data (SKILL.md files live under
# the package tree). An older force-include table here added every file a
# SECOND time and wheel builds died with "same path added twice" the
# moment a new skill directory appeared (reproduced with idea-forge).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_input: marks tests that synthesize real mouse/keyboard input (deselect with -m 'not real_input')",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Quality gate: pyflakes (real errors), import sorting, pyupgrade basics.
# Accepted-by-design: BLE001 blind excepts
# (agent resilience), RUF012 tool schema class dicts, S110 try-except-pass
# (never-crash hooks), DTZ naive local time.
select = ["E4", "E7", "E9", "F", "I"]
ignore = []

[tool.coverage.run]
source = ["src/oaset"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# win32-only ctypes/UIA module: attribute checks are platform-conditional.
# The module is exercised by real-machine tests on Windows (tests/test_uia_real.py).
[[tool.mypy.overrides]]
module = ["oaset.computer.uia_backend", "oaset.computer.vision"]
disable_error_code = ["attr-defined", "has-type"]

# Command-domain mixins (P4-1): their methods run on OasetApp but live in
# separate modules, so every `self.<host attribute>` is attr-defined to mypy.
# The host class (and the full type context) stays in oaset.tui.app; other
# error codes are still checked in these modules.
[[tool.mypy.overrides]]
module = "oaset.tui.controllers.*"
disable_error_code = ["attr-defined", "has-type"]


